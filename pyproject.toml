[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-triage"
version = "0.1.0"
description = "Cluster logs into templates and surface only what is new since the last deploy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []
keywords = ["logs", "observability", "troubleshooting", "devops", "clustering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/aiplusplus360/log-triage"

[project.scripts]
log-triage = "logtriage.cli:main"

[tool.setuptools.packages.find]
include = ["logtriage*"]
